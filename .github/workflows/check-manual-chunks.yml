name: Guard manualChunks (V15)

on:
  push:
    paths:
      - "vite.config.ts"
      - "scripts/check-manual-chunks.mjs"
  pull_request:
    paths:
      - "vite.config.ts"
      - "scripts/check-manual-chunks.mjs"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run manualChunks guard
        run: node scripts/check-manual-chunks.mjs
      - name: Run guard test suite
        run: node scripts/check-manual-chunks.mjs --test
