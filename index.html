      <div style="max-width:680px;margin:0 auto;padding:40px 20px;font-family:system-ui,sans-serif;color:#1a1a1a;line-height:1.6;">
        <h1>Fitness consistency for the life you actually live.</h1>
        <p>Build sustainable fitness habits with daily check-ins, recovery-aware guidance, and progress tracking designed for adults 40+.</p>
        <p><a href="https://momentumfit.app/auth?mode=signup">Start My Free Fitness Routine</a> or <a href="https://momentumfit.app/7-day-reset">try the 7-Day Readiness Reset</a>.</p>
        <h2>After 40, the hard part is not the workout. It is the week around it.</h2>
        <p>Work runs late. Sleep comes up short. A knee or a shoulder has opinions. Momentum starts from how today actually is. You check in, it tells you how hard today should be, and a lighter day still counts.</p>
        <h2>A one-minute check-in sets today's plan</h2>
        <ol>
          <li>Check in. Rate six things from 1 to 5: sleep, energy, recovery, soreness, pain, and whether you want to train.</li>
          <li>Get today's plan: full workout, reduced workout, mobility and recovery, or a rest day.</li>
          <li>Log what you did. A 5, 10 or 20 minute session still counts.</li>
        </ol>
        <h2>Guidance that fits the day you are having</h2>
        <ul>
          <li>Your dashboard shows today's plan in plain words.</li>
          <li>Report notable pain and the app will not recommend a full workout. You can log where it hurts on a body map.</li>
          <li>A rest day is a plan, not a missed day.</li>
          <li>Momentum does not write your workout. You choose the session, and the exercise library is there for ideas.</li>
          <li>AI Coach (Premium) is a chat that is given your streak, your habit count, when you last logged and today's plan. It is an AI, not a trainer or a clinician.</li>
        </ul>
        <h2>Miss a day. Keep the streak.</h2>
        <p>Miss a single day and Momentum offers a repair the next day: a 5, 10 or 20 minute makeup session, or a grace token. You earn one token for every 7 days you log. The window closes 48 hours after the missed day begins.</p>
        <h2>Free versus Premium</h2>
        <p><strong>Free:</strong> up to 3 habits, daily readiness check-in and today's plan, streaks with the 48-hour repair window, 7 days of history, basic charts.</p>
        <p><strong>Premium ($7.99/mo or $69.99/yr):</strong> unlimited habits, unlimited history, AI Coach chat, Weekly Insights report, CSV and JSON data export.</p>
        <h2>The 7-Day Readiness Reset</h2>
        <p>Seven small actions, one a day, all listed on one page: sleep anchor, morning light, hydration, movement snack, evening shutdown, reflection, plan next week. It is a routine reset, not a workout program. <a href="https://momentumfit.app/7-day-reset">See the 7-Day Readiness Reset</a>.</p>
        <h2>Exercise and health disclaimer</h2>
        <p>Momentum is a general fitness and habit tool. It does not give medical advice and it does not diagnose or treat any condition. Talk to your doctor before you start or change an exercise routine. If something hurts, stop.</p>
